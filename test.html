<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Paper #87 — SATlab</title>

    <link rel="stylesheet" href="test.css">
</head>

<body>

    <header class="test-header">

        <div class="test-brand">
            SATlab
        </div>

        <div class="test-info">
            Paper #87
        </div>

        <div class="test-progress">
            Question <span id="currentQuestion">1</span> of <span id="totalQuestions">27</span>
        </div>

    </header>


    <main class="test-main">

        <div class="question-area">

            <div class="question-number">
                Question 1
            </div>

            <div class="question-text" id="questionText">
                Question will appear here.
            </div>

            <div class="answers" id="answers">

                <button class="answer">
                    <span class="choice-letter">A</span>
                    <span>Answer choice A</span>
                </button>

                <button class="answer">
                    <span class="choice-letter">B</span>
                    <span>Answer choice B</span>
                </button>

                <button class="answer">
                    <span class="choice-letter">C</span>
                    <span>Answer choice C</span>
                </button>

                <button class="answer">
                    <span class="choice-letter">D</span>
                    <span>Answer choice D</span>
                </button>

            </div>

        </div>


        <div class="test-navigation">

            <button class="nav-button previous" id="previousButton">
                ← Previous
            </button>

            <button class="nav-button next" id="nextButton">
                Next →
            </button>

        </div>

    </main>


    <script src="test.js"></script>

</body>
</html>
